<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LK Калькулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161F; --surface: #181E29; --surface-2: #202834;
    --accent: #3F86C6; --text: #ECEFF3; --muted: #8A93A3;
    --line: rgba(236,239,243,0.12); --danger: #D8483B;
    --water: #6E9FC4; --gas: #D08A4C; --gas15: #8FB37A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #EDF1F6;
      --accent: #2E6CA8; --text: #171B22; --muted: #667080;
      --line: rgba(23,27,34,0.12); --danger: #C23B2E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161F; --surface: #181E29; --surface-2: #202834;
    --accent: #3F86C6; --text: #ECEFF3; --muted: #8A93A3;
    --line: rgba(236,239,243,0.12); --danger: #D8483B;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100%; }
  body { display: flex; justify-content: center; padding: 32px 14px 56px; }
  .sheet { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 26px 22px 24px; }
  h1 { font-family: 'Lora', serif; font-weight: 600; font-size: 21px; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 20px; font-style: italic; font-family: 'Lora', serif; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  thead th { font-size: 11px; color: var(--muted); font-weight: 500; text-align: left; padding: 0 6px 8px; border-bottom: 1px dashed var(--line); }
  thead th.num { text-align: right; }
  tbody td { padding: 6px; vertical-align: middle; }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 7px 8px;
    font-variant-numeric: tabular-nums; outline: none;
  }
  tbody input:focus { border-color: var(--accent); }
  td.size input { min-width: 70px; }
  td.num { text-align: right; white-space: nowrap; }
  td.type select { width: 100%; min-width: 108px; padding: 7px 6px; font-size: 13px; }
  tr[data-type="Водяной газ"] { box-shadow: inset 3px 0 0 var(--water); }
  tr[data-type="Газ 13"] { box-shadow: inset 3px 0 0 var(--gas); }
  tr[data-type="Газ 15"] { box-shadow: inset 3px 0 0 var(--gas15); }
  tr[data-type="Водяной газ"] td.type select { border-color: var(--water); color: var(--water); }
  tr[data-type="Газ 13"] td.type select { border-color: var(--gas); color: var(--gas); }
  tr[data-type="Газ 15"] td.type select { border-color: var(--gas15); color: var(--gas15); }
  .price[readonly] { background: transparent; border-color: transparent; color: var(--accent); text-align: right; cursor: default; }
  .line-total { font-variant-numeric: tabular-nums; font-size: 14px; }
  .row-remove {
    background: none; border: none; color: var(--muted); font-size: 17px; line-height: 1;
    cursor: pointer; padding: 4px 6px;
  }
  .row-remove:hover { color: var(--danger); }

  .add-row {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed var(--line); color: var(--muted);
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 12px; border-radius: 5px;
    cursor: pointer; margin-bottom: 20px; width: 100%; justify-content: center;
  }
  .add-row:hover { border-color: var(--accent); color: var(--accent); }

  fieldset { border: none; margin: 0 0 18px; padding: 0; }
  legend { font-size: 11px; color: var(--muted); width: 100%; border-bottom: 1px dashed var(--line); padding-bottom: 8px; margin-bottom: 12px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field-row { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .field-row:focus-within { border-color: var(--accent); }
  .field-row input {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 17px; font-variant-numeric: tabular-nums; padding: 4px 0; min-width: 0;
  }
  .unit { font-size: 13px; color: var(--muted); margin-left: 8px; white-space: nowrap; }

  .divider { border: none; border-top: 1px dashed var(--line); margin: 20px 0 14px; }
  .line-item { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; padding: 5px 0; }
  .line-item .label { color: var(--muted); }
  .line-item .value { font-variant-numeric: tabular-nums; }

  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 14px; border-top: 2px solid var(--text); }
  .total-row .label { font-family: 'Lora', serif; font-weight: 600; font-size: 16px; }
  .total-row .value { font-family: 'Lora', serif; font-weight: 600; font-size: 25px; font-variant-numeric: tabular-nums; color: var(--danger); }

  .per-person { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
  .per-person .label { font-size: 13px; color: var(--muted); }
  .per-person .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--danger); }

  select {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 6px 8px; outline: none;
  }
  .currency-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .currency-row label { font-size: 12.5px; color: var(--muted); }

  .toggle-btn {
    width: 100%; padding: 9px 0; border-radius: 5px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    transition: all 0.15s ease;
  }
  .toggle-btn.active {
    background: rgba(216,72,59,0.14);
    border-color: var(--danger); color: var(--danger);
  }
</style>

<body>
<div class="sheet">
  <h1>LK Калькулятор</h1>
  <p class="subtitle">размер · цена · количество → раздел на людей</p>

  <div class="currency-row">
    <label for="currency">Валюта</label>
    <select id="currency"><option>₽</option><option>€</option><option>$</option><option>£</option></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Тип</th>
        <th class="num">Размер, см</th>
        <th class="num">Цена/шт</th>
        <th class="num">Кол-во</th>
        <th class="num">Сумма</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="add-row" id="addRow">+ добавить размер</button>

  <fieldset>
    <legend>Раздел</legend>
    <div class="two-col">
      <div class="field">
        <label for="people">Количество людей</label>
        <div class="field-row">
          <input id="people" type="number" inputmode="numeric" min="1" step="1" placeholder="1">
          <span class="unit">чел.</span>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="toggleX2" class="toggle-btn" type="button">Подработка</button>
      </div>
    </div>
  </fieldset>

  <hr class="divider">

  <div class="line-item">
    <span class="label">Сумма по позициям</span>
    <span class="value" id="out-subtotal">€0.00</span>
  </div>

  <div class="total-row">
    <span class="label">Итого</span>
    <span class="value" id="out-total">€0.00</span>
  </div>
  <div class="per-person">
    <span class="label">На человека</span>
    <span class="value" id="out-per-person">€0.00</span>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const rowsBody = $('rows');
  const currencySel = $('currency');
  let rowId = 0;

  function fmt(n) {
    return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function num(el) {
    const v = parseFloat(el.value);
    return isNaN(v) ? 0 : v;
  }

  // цены по типам шланга: диапазон размера в см -> цена за штуку
  const priceTables = {
    'Водяной газ': [
      { min: 20,  max: 80,   price: 3.43 },
      { min: 100, max: 150,  price: 4.29 },
      { min: 180, max: 300,  price: 5.01 },
      { min: 350, max: 500,  price: 6.20 },
      { min: 700, max: 1000, price: 12.00 },
    ],
    'Газ 13': [
      { min: 20,  max: 80,  price: 5.47 },
      { min: 90,  max: 150, price: 6.13 },
      { min: 180, max: 300, price: 7.08 },
      { min: 350, max: 600, price: 8.36 },
    ],
    'Газ 15': [
      { min: 20,  max: 80,   price: 5.72 },
      { min: 90,  max: 150,  price: 6.48 },
      { min: 180, max: 350,  price: 8.04 },
      { min: 400, max: 600,  price: 8.45 },
      { min: 700, max: 1000, price: 12.00 },
    ],
  };
  const hoseTypes = Object.keys(priceTables);

  function lookupPrice(type, sizeCm) {
    const table = priceTables[type];
    if (!table || !sizeCm) return null;
    for (const band of table) {
      if (sizeCm >= band.min && sizeCm <= band.max) return band.price;
    }
    return null;
  }

  function addRow(type = hoseTypes[0], sizeCm = '', qty = '') {
    const id = rowId++;
    const tr = document.createElement('tr');
    tr.dataset.id = id;
    const options = hoseTypes.map(t => `<option value="${t}"${t === type ? ' selected' : ''}>${t}</option>`).join('');
    tr.innerHTML = `
      <td class="type"><select class="type-select">${options}</select></td>
      <td class="num"><input type="number" inputmode="numeric" min="0" step="1" placeholder="см" value="${sizeCm}" class="size-cm"></td>
      <td class="num"><input type="text" class="price" value="—" readonly tabindex="-1"></td>
      <td class="num"><input type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${qty}" class="qty"></td>
      <td class="num line-total">—</td>
      <td><button class="row-remove" title="удалить">×</button></td>
    `;
    tr.querySelectorAll('input, select').forEach(inp => inp.addEventListener('input', calc));
    tr.querySelector('.row-remove').addEventListener('click', () => { tr.remove(); calc(); });
    rowsBody.appendChild(tr);
  }

  let doubled = false;

  function calc() {
    const cur = currencySel.value;
    let subtotal = 0;

    rowsBody.querySelectorAll('tr').forEach(tr => {
      const type = tr.querySelector('.type-select').value;
      tr.dataset.type = type;
      const sizeCm = num(tr.querySelector('.size-cm'));
      const qty = num(tr.querySelector('.qty'));
      const price = lookupPrice(type, sizeCm);
      const priceField = tr.querySelector('.price');

      if (price === null) {
        priceField.value = sizeCm ? 'нет цены' : '—';
        tr.querySelector('.line-total').textContent = '—';
        return;
      }
      priceField.value = cur + fmt(price);
      const lineTotal = price * qty;
      tr.querySelector('.line-total').textContent = cur + fmt(lineTotal);
      subtotal += lineTotal;
    });

    const total = doubled ? subtotal * 2 : subtotal;
    const people = Math.max(1, num($('people')) || 1);
    const perPerson = total / people;

    $('out-subtotal').textContent = cur + fmt(subtotal);
    $('out-total').textContent = cur + fmt(total);
    $('out-per-person').textContent = cur + fmt(perPerson);
  }

  $('addRow').addEventListener('click', () => { addRow(); calc(); });
  currencySel.addEventListener('change', calc);
  $('people').addEventListener('input', calc);
  $('toggleX2').addEventListener('click', () => {
    doubled = !doubled;
    $('toggleX2').classList.toggle('active', doubled);
    calc();
  });

  // seed with a few rows to fill in
  addRow('Водяной газ', '', '');
  addRow('Водяной газ', '', '');
  addRow('Водяной газ', '', '');
  calc();
</script>
</body>
</html>
